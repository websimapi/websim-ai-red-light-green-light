<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Red Light Green Light</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🤖 AI Red Light Green Light</h1>
            <div class="instructions">
                <p>Start from the back of the room. Move during GREEN LIGHT, freeze during RED LIGHT!</p>
                <p>Get close enough to press SPACEBAR to win!</p>
            </div>
        </div>

        <div class="game-area">
            <div class="video-container">
                <video id="webcam" autoplay muted></video>
                <canvas id="motionCanvas"></canvas>
                <div class="game-overlay">
                    <div id="gameStatus" class="status">Click Start to Play!</div>
                    <div id="lightIndicator" class="light-indicator"></div>
                    <div id="distanceBar" class="distance-bar">
                        <div id="distanceProgress" class="distance-progress"></div>
                        <div class="finish-line">🏁</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="start-btn">Start Game</button>
            <button id="calibrateBtn" class="calibrate-btn">Calibrate Position</button>
            <div class="ai-status">
                <div id="aiSpeaking" class="ai-indicator">🤖 AI Ready</div>
            </div>
        </div>

        <div class="debug-info">
            <div>Motion Level: <span id="motionLevel">0</span></div>
            <div>Distance: <span id="distanceDisplay">0%</span></div>
            <div>Game State: <span id="gameState">idle</span></div>
        </div>
    </div>

    <script src="audio.js"></script>
    <script src="main.js"></script>

</body>
</html>
